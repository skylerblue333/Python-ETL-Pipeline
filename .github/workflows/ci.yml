name: etl-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff pip-audit
      - name: Compile
        run: python -m compileall -q main.py src tests
      - name: Lint
        run: ruff check main.py src tests
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Build image
        run: docker build -t sky-etl:ci .
      - name: Verify non-root image
        run: |
          test "$(docker run --rm --entrypoint id sky-etl:ci -u)" != "0"
